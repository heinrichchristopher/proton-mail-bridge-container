name: Check for new Bridge release

on:
  schedule:
    - cron: "17 */6 * * *"   # alle 6 Stunden
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare versions
        id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/ProtonMail/proton-bridge/releases/latest --jq .tag_name)
          latest=${latest#v}
          current=$(tr -d '[:space:]' < VERSION)
          echo "latest=$latest current=$current"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" != "$current" ]; then echo "new=true" >> "$GITHUB_OUTPUT"; fi

      - name: Check .deb exists
        if: steps.cmp.outputs.new == 'true'
        run: curl -fsSI "https://proton.me/download/bridge/protonmail-bridge_${{ steps.cmp.outputs.latest }}-1_amd64.deb"

      - name: Bump, tag and trigger build
        if: steps.cmp.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.cmp.outputs.latest }}"
          echo "$v" > VERSION
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump Proton Mail Bridge to $v"
          git tag "v$v"
          git push origin main "v$v"
          # GITHUB_TOKEN-Pushes starten keine Workflows -> Build explizit anstoßen
          gh workflow run build.yml --ref main
          gh release create "v$v" --title "Bridge $v" --notes "Image mit Proton Mail Bridge $v"
